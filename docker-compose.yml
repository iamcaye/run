services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: run
      POSTGRES_PASSWORD: run
      POSTGRES_DB: run
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U run -d run"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
